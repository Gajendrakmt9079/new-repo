     <script>
        let name = "Dimple";
        let sub1 = 90;

        console.log("Student Name: " + name);

            result = "Pass";

        let grade;

            grade = "90";
        }
        else if (percentage >= 75) {

        }

            grade = "60";

        switch (grade) {

                console.log("Grade A");
                break;

            case "35":

            default:

                break;
        }
