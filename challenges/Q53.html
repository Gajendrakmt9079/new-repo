<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Movie Ticket Booking</h1>
</body>
<script>
    // Q53. Movie Ticket Booking
    // Create a ticket booking program.
    // Conditions:
    // Age below 5: Free ticket
    // Age 5–12: ₹100
    // Age 13–59: ₹200
    // Age 60 or above: ₹150
    // Add a weekend surcharge of ₹50.
    // Print the final ticket price.

    var age = prompt("Enter age");
    var isWeekend = prompt("Is it weekend? (yes/no)");
    var ticketPrice = 0;
    if(age !== parseInt(age)  && isWeekend !== "yes" && isWeekend !== "no"){
        console.log("Invalid age or weekend input");
    } 
    else if (age < 5) {
        ticketPrice = 0;
    } else if (age >= 5 && age <= 12) {
        ticketPrice = 100;
    } else if (age >= 13 && age <= 59) {
        ticketPrice = 200;
    } else if (age >= 60) {
        ticketPrice = 150;
    }
    if (isWeekend === "yes") {
        ticketPrice += 50;
    }
    console.log("Final ticket price: " + ticketPrice);

</script>
</html>
