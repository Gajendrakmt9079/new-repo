<body>
    <h1>Student Results</h1>

</body>
<script>
    // JavaScript code for handling student results
    let studentName = "Jyosna";
    let maths = 90;
    let science = 80;
    let english = 70;
    let social = 60;
    let hindi = 50;
    let totalmarks = maths + science + english + social + hindi;
    let percentage = (totalmarks / 500) * 100;

    console.log("Name: " + studentName);
    console.log("Maths: " + maths);
    console.log("Science: " + science);
    console.log("English: " + english);
    console.log("Social: " + social);
    console.log("Hindi: " + hindi);
    console.log("Total Marks: " + totalmarks);
    console.log("Percentage: " + percentage);
    let result;
    if(maths >35 && science > 35 && english > 35 && social > 35 && hindi > 35) {
        result = "Pass";
    } else {
        result = "Fail";
    }
    
    console.log("Result: " + result);

    if (percentage >= 90) {
        console.log("Grade: A");
    }
    else if (percentage >= 80) {
        console.log("Grade: B");
    }
    else if (percentage >= 70) {
        console.log("Grade: C");
    }
    else if (percentage >= 60) {
        console.log("Grade: D");
    }
    else if (percentage < 60) {
        console.log("Grade: F");
    }
    else if (percentage < 35) {
        console.log("Fail");
    }
    else {
        console.log("Invalid percentage");
    }
</script>
