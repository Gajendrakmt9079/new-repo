  <body>
    <h1>ATM Simulation</h1>
  </body>
  <script>
    // Q51. ATM Simulation
    // Create a simple ATM program.
    // Initial balance: ₹10,000
    // Options:
    // 1.  Check balance
    // 2.  Deposit money
    // 3.  Withdraw money
    // Conditions:
    // Deposit amount must be greater than zero.
    // Withdrawal amount must be greater than zero.
    // Withdrawal cannot exceed the available balance.
    // Use switch.

    var balance = 10000;
    var option = prompt("Enter option: 1. Check balance, 2. Deposit money, 3. Withdraw money");

    var pin = prompt("Enter your PIN");
   

    switch (option) {
      case "1":
        if (pin !== "1234") {
          console.log("Invalid PIN");
          break;
        }
        console.log("Your balance is: " + balance);
        break;
      case "2":
        if (pin !== "1234") {
          console.log("Invalid PIN");
          break;
        }
        var deposit = prompt("Enter deposit amount");
        if (deposit > 0) {
          balance += Number(deposit);
          console.log("Your balance is: " + balance);
        } else {
          console.log("Deposit amount must be greater than zero");
        }
        break;
      case "3":
        if (pin !== "1234") {
          console.log("Invalid PIN");
          break;
        }
        var withdraw = prompt("Enter withdraw amount");
        if (withdraw > 0 && withdraw <= balance) {
          balance -= withdraw;
          console.log("Your balance is: " + balance);
        } else {
          console.log("Withdrawal amount must be greater than zero and cannot exceed the available balance");
        }
        break;
      default:
        console.log("Invalid option");
    }
  </script>
</html>
