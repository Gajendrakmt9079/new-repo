<body>
<h1>
  Q53. Movie Ticket Booking <br>
Create a ticket booking program
</h1>
</body>
<script>
//   Conditions:
// Age below 5: Free ticket
// Age 5–12: ₹100
// Age 13–59: ₹200
// Age 60 or above: ₹150
// Add a weekend surcharge of ₹50.
// Print the final ticket price.
let age = prompt("Enter Age")
let price =0;
if (age <5){
  price= 0;
}else if(age >=5 && age <=12){
  price = 100;
}else if(age >=13 && age <=59){
  price = 200;
}else if(age >=60){
  price = 150;
}
let day = prompt("Enter day")
if (day == "Saturday" || day == "Sunday"){
  price += 50;
}
console.log("Price of the ticket "+ price);

</script>
